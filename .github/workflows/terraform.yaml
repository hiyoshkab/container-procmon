name: Terraform

on:
  workflow_call:
    inputs:
      container_image:
        description: "Exact image to deploy: repository@sha256:digest"
        type: string
        required: true
      apply:
        description: "Apply Terraform changes after review"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      container_image:
        description: "Image to deploy or roll back to: repository@sha256:digest"
        type: string
        required: true
      apply:
        description: "Apply Terraform changes after review"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Initialize remote backend
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Create Terraform plan
        env:
          TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
          TF_VAR_location: ${{ vars.LOCATION }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_container_image: ${{ inputs.container_image }}
        run: |
          # Unset empty GitHub variables so Terraform uses its declared defaults.
          for variable in "${!TF_VAR_@}"; do
            if [[ -z "${!variable}" ]]; then
              unset "$variable"
            fi
          done
          terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

      - name: Publish plan in job summary
        env:
          CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          {
            echo "## Terraform plan"
            echo
            printf 'Image: `%s`\n\n' "$CONTAINER_IMAGE"
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
  
  apply:
    name: Terraform Apply
    needs: plan
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
        
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
        
      - name: Initialize remote backend
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          terraform init -reconfigure -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"
      
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
        
      - name: Apply Terraform plan
        run: terraform apply -input=false -auto-approve tfplan